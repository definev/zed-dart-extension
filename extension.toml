id = "dart"
name = "Dart"
description = "Dart and Flutter development support."
version = "0.4.4"
schema_version = 1
authors = [
    "Abdullah Alsigar <abdullah.alsigar@gmail.com>",
    "Flo <flo80@users.noreply.github.com>",
    "ybbond <hi@ybbond.id>",
    "nielsenko <kasper@byolimit.com>",
    "bsutton <bsutton@onepub.dev>",
]
repository = "https://github.com/zed-extensions/dart"

[[capabilities]]
kind = "process:exec"
command = "dart"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "dart.exe"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "flutter"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "flutter.bat"
args = ["**"]

[language_servers.dart]
name = "Dart LSP"
language = "Dart"
languages = ["Dart"]

[grammars.dart]
repository = "https://github.com/UserNobody14/tree-sitter-dart"
commit = "6922ad29141e819773d6ffb0c6d2c27adefb5acc"

[debug_adapters.Dart]
# Optional relative path to the JSON schema for the debug adapter configuration schema. Defaults to `debug_adapter_schemas/$DEBUG_ADAPTER_NAME_ID.json`.
# Note that while this field is optional, a schema is mandatory.
# schema_path = "relative/path/to/schema.json"

[debug_locators.dart]

[context_servers.flutter-tools]

[slash_commands.flutter-devices]
description = "List available Flutter debug devices"
requires_argument = false
tooltip_text = "List Flutter devices"

[slash_commands.flutter]
description = "Flutter slash command help and subcommand dispatcher"
requires_argument = false
tooltip_text = "Show Flutter slash command help"

[slash_commands.flutter-devtools]
description = "Build a Flutter DevTools URL from a VM service URI"
requires_argument = true
tooltip_text = "Build DevTools URL"

[slash_commands.flutter-hot-reload]
description = "Temporarily trigger Flutter hot reload through a shell-backed attach shim"
requires_argument = false
tooltip_text = "Trigger Flutter hot reload"

[slash_commands.flutter-hot-restart]
description = "Temporarily trigger Flutter hot restart through a shell-backed attach shim"
requires_argument = false
tooltip_text = "Trigger Flutter hot restart"

[slash_commands.flutter-vm-probe]
description = "Connect to a Flutter VM service and call getVM"
requires_argument = true
tooltip_text = "Probe Flutter VM service"
